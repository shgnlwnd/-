# 출하기(6/10~7/10)에 매일 복숭아 경매 가격을 받아 Firestore에 저장함.
# 저장소 Settings → Secrets and variables → Actions에
# KAT_SERVICE_KEY, FIREBASE_SERVICE_ACCOUNT 두 값을 등록해야 함.
name: 복숭아 가격 수집

on:
  schedule:
    - cron: "10 7 * * *"   # 매일 한국 시간 16:10 (UTC 07:10). 비수기엔 스크립트가 바로 끝남
  workflow_dispatch:         # Actions 탭에서 직접 실행할 수도 있음

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py daily
        env:
          KAT_SERVICE_KEY: ${{ secrets.KAT_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
