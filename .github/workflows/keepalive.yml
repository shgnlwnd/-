# Render 무료 서버는 15분 동안 요청이 없으면 잠들어서, 다음 요청이 50초 넘게 걸림.
# 10분마다 /health를 불러 깨어 있게 함. 비밀값은 필요 없음.
# 무료 서버 한 대를 한 달 내내 켜 둬도 Render 무료 한도(월 750시간) 안임.
name: 가격 서버 깨워 두기

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 늦게 돌 수 있음)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://peach-price-api.onrender.com/health
