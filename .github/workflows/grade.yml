# 등급별 시세 재집계와 Firestore 현황 보고. Actions 탭에서 직접 실행함.
# - report: 연도별 문서 수, 등급 자료 날짜 범위, 실제 등급명(grd_nm), 등급 가격비만 출력
# - backfill: 백업 → grades 없는 날짜 재집계 → 현황 출력
#   날짜당 시장 32곳을 다시 부르므로 2020~2026년 전체는 약 7,000회 호출(일일 한도 10,000회).
#   중간에 끊기면 같은 설정으로 다시 실행하면 이미 끝난 날짜는 건너뜀.
# - trees: 예측 모델(나무 200개)의 질문 전체 목록. 요약은 Summary, 전체 CSV는 Artifacts
# 결과는 실행 화면의 Summary와 백업 파일(Artifacts)에서 확인함.
name: 등급 재집계와 자료 현황

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report(현황만), backfill(재집계), trees(예측 모델 나무 질문 목록)"
        required: true
        default: report
        type: choice
        options: [report, backfill, trees]
      from_year:
        description: 재집계 시작 연도
        default: "2020"
      to_year:
        description: 재집계 끝 연도
        default: "2026"

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAT_SERVICE_KEY: ${{ secrets.KAT_SERVICE_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 재집계 전 백업
        if: inputs.mode == 'backfill'
        run: python collect.py export peach_daily_backup.json
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'backfill'
        with:
          name: peach_daily_backup
          path: peach_daily_backup.json
      - name: 등급 재집계
        if: inputs.mode == 'backfill'
        run: python -u collect.py grade-backfill ${{ inputs.from_year }} ${{ inputs.to_year }}
      - name: 예측 모델 나무 질문 목록
        if: inputs.mode == 'trees'
        run: python collect.py tree-dump tree_questions.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'trees'
        with:
          name: tree_questions
          path: |
            tree_questions.csv
            tree_questions_leaves.csv
      - name: 현황 보고
        if: always() && inputs.mode != 'trees'
        run: |
          python collect.py report | tee -a "$GITHUB_STEP_SUMMARY"
          python collect.py grade-ratios | tee -a "$GITHUB_STEP_SUMMARY"
