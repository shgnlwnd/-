# Render Blueprint: 앱이 부르는 가격 API (무료 플랜 웹 서비스)
# 매일 수집은 GitHub Actions(.github/workflows/collect.yml)가 맡음.
# 비밀값(sync: false)은 Render 대시보드에서 직접 입력함.
services:
  - type: web
    name: peach-price-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: REQUIRE_AUTH
        value: "true"
